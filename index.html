<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FFF3D9">
<title>NEXUS Protocol</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@500;600;700&family=VT323&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ==========================================================
   NEXUS Protocol — styled to match the club website
   (bright RetroUI: warm cream ground, hard near-black borders,
   solid offset shadows, sharp corners, pixel display type).
   Single committed light theme, exactly like the club site.
   ========================================================== */
:root{
  --bg:#FFF3D9; --bg-2:#FFEFC9;
  --panel:#FFFFFF; --panel-2:#FFFBEF;
  --ink:#17131f; --ink-dim:#524b5c; --ink-faint:#6d6675;
  --line:#17131f; --rui-shadow:#17131f;
  --pink:#E94560; --pink-2:#ff5c78; --pink-dark:#b91d38; --pink-soft:#ffe7ea;
  --gold:#F4A400; --gold-soft:#fff1cf;
  --teal:#0FA6AE; --teal-text:#0B7278; --teal-soft:#ddf3f4;
  --logo:#00b874; --green-soft:#dcf6e8;
  --danger:#E11D48;
  --sh:5px 5px 0 var(--rui-shadow);
  --sh-sm:3px 3px 0 var(--rui-shadow);
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --display:'Space Grotesk',var(--sans);
  --pixel:'Press Start 2P',ui-monospace,monospace;
  --mono:'VT323',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:var(--sans); font-size:16px; line-height:1.6;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
}
/* flat dot grid, same as the club site */
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:radial-gradient(rgba(23,19,31,.07) 1.5px,transparent 1.5px);
  background-size:26px 26px;
  -webkit-mask-image:radial-gradient(135% 100% at 50% 0%,#000 60%,transparent 100%);
          mask-image:radial-gradient(135% 100% at 50% 0%,#000 60%,transparent 100%)}
/* faint CRT scanlines — static, so it stays on under reduced motion */
.crt{position:fixed;inset:0;z-index:3;pointer-events:none;
  background:repeating-linear-gradient(180deg,rgba(23,19,31,.032) 0 1px,transparent 1px 3px)}

h1,h2,h3,h4{font-family:var(--display);margin:0;line-height:1.15;font-weight:700;letter-spacing:-.01em;color:var(--ink);text-wrap:balance}
a{color:var(--teal-text)}
button{font:inherit;color:inherit}
.mono{font-family:var(--mono);font-size:1.15em}
.dim{color:var(--ink-dim)}
.small{font-size:.86rem}
::selection{background:var(--pink);color:#fff}

.wrap{max-width:34rem;margin:0 auto;padding:0 16px calc(56px + env(safe-area-inset-bottom));position:relative;z-index:1}
.wrap.wide{max-width:66rem}

/* ---------------- top bar ---------------- */
header.top{
  position:sticky;top:0;z-index:20;
  background:rgba(255,243,217,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:3px solid var(--ink);
  margin:0 -16px 18px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top));
  display:flex;align-items:center;gap:10px;flex-wrap:wrap
}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--pixel);font-size:12px;line-height:1.5}
.brand .mark{width:26px;height:26px;flex:none}
.brand .mark svg{width:100%;height:100%;display:block;filter:drop-shadow(2px 2px 0 rgba(23,19,31,.25))}
.brand .nx{color:var(--pink)}
.toggles{margin-left:auto;display:flex;gap:6px}
.tg{font-family:var(--pixel);font-size:8px;line-height:1.5;background:var(--panel);border:2px solid var(--ink);
  padding:7px 8px;cursor:pointer;box-shadow:var(--sh-sm);white-space:nowrap}
.tg:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--rui-shadow)}
.tg.off{color:var(--ink-faint)}

footer.foot{margin:26px 0 0;padding-top:14px;border-top:3px solid var(--ink);
  color:var(--ink-faint);font-family:var(--mono);font-size:16px;display:flex;gap:16px;flex-wrap:wrap;align-items:center;position:relative;z-index:1}
footer.foot a{color:var(--ink-dim);cursor:pointer}
footer.foot a:hover{color:var(--teal-text)}

/* ---------------- cards ---------------- */
.card{background:var(--panel);border:2px solid var(--line);padding:20px;box-shadow:var(--sh);margin-bottom:16px}
.card h1{font-size:clamp(24px,6vw,30px);margin:0 0 10px}
.card h2{font-size:20px;margin:0 0 10px}
.card p{margin:9px 0}
.eyebrow{display:inline-block;font-family:var(--pixel);font-size:9px;line-height:1.6;color:var(--pink);
  background:var(--panel-2);border:2px solid var(--ink);padding:7px 10px;margin-bottom:12px;box-shadow:var(--sh-sm)}

/* status stamp */
.stamp{display:inline-block;font-family:var(--pixel);font-size:9px;line-height:1.6;
  border:2px solid currentColor;padding:8px 11px;margin-bottom:14px;transform:rotate(-1.6deg);
  animation:stampIn .24s ease-out}
@keyframes stampIn{from{transform:rotate(-1.6deg) scale(1.6);opacity:0}to{transform:rotate(-1.6deg) scale(1);opacity:1}}
.stamp.ok{color:var(--teal-text);background:var(--teal-soft)}
.stamp.err{color:var(--pink-dark);background:var(--pink-soft)}
.stamp.warn{color:#8a5a10;background:var(--gold-soft)}
.stamp.gold{color:#8a5a10;background:var(--gold-soft)}
.stamp.neutral{color:var(--ink-dim);background:var(--bg-2)}

/* ---------------- mission HUD ---------------- */
.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.hud .h{background:var(--panel);border:2px solid var(--ink);box-shadow:var(--sh-sm);padding:9px 8px;text-align:center;min-width:0}
.hud .hl{font-family:var(--pixel);font-size:7px;line-height:1.6;color:var(--ink-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud .hv{font-family:var(--pixel);font-size:13px;line-height:1.5;margin-top:7px;font-variant-numeric:tabular-nums}
.hud .hv.pink{color:var(--pink)}
.hud .hv.teal{color:var(--teal-text)}
.hud .hv.gold{color:#8a5a10}

/* control / trace meters */
.meter{margin-bottom:14px}
.meter .mt{display:flex;justify-content:space-between;align-items:baseline;gap:8px;
  font-family:var(--pixel);font-size:8px;line-height:1.7;color:var(--ink-faint);margin-bottom:6px}
.meter .mt b{color:var(--pink)}
.meter .bar{height:16px;background:var(--panel-2);border:2px solid var(--ink);overflow:hidden}
.meter .bar i{display:block;height:100%;width:0;background:var(--pink);transition:width .7s cubic-bezier(.2,.8,.2,1)}
.meter.trace .bar i{background:var(--gold)}

/* ---------------- node map ---------------- */
.nodes{display:flex;gap:6px;margin:0 0 6px;flex-wrap:wrap}
.nm{flex:1 1 0;min-width:36px;border:2px solid var(--ink);background:var(--panel);
  box-shadow:var(--sh-sm);padding:8px 2px;text-align:center;position:relative}
.nm .n{font-family:var(--pixel);font-size:11px;line-height:1.4}
.nm .t{font-family:var(--mono);font-size:13px;color:var(--ink-faint);margin-top:3px;line-height:1.1}
.nm.on{background:var(--teal);color:#fff}
.nm.on .t{color:rgba(255,255,255,.85)}
.nm.core{border-color:var(--gold)}
.nm.core.on{background:var(--gold);color:var(--ink)}
.nm.core.on .t{color:rgba(23,19,31,.7)}
.nm.next{border-color:var(--pink);box-shadow:inset 0 0 0 2px var(--pink),var(--sh-sm)}
.nm.next .n{color:var(--pink)}
.nm.pop{animation:nmPop .45s cubic-bezier(.2,.8,.2,1)}
@keyframes nmPop{0%{transform:scale(.6) rotate(-6deg)}60%{transform:scale(1.18)}100%{transform:scale(1)}}

/* ---------------- NEXUS voice + terminal ---------------- */
.nexus{font-family:var(--mono);font-size:19px;line-height:1.45;
  background:var(--panel-2);border:2px solid var(--ink);border-left:6px solid var(--pink);
  padding:11px 14px;margin:14px 0;box-shadow:var(--sh-sm)}
.nexus .who{font-family:var(--pixel);font-size:8px;line-height:1.8;color:var(--pink);display:block;margin-bottom:6px}
.term{font-family:var(--mono);font-size:19px;line-height:1.45;background:var(--ink);color:#7dffc4;
  border:2px solid var(--ink);padding:14px;box-shadow:var(--sh-sm);margin:0 0 14px;white-space:pre-wrap;min-height:6.2em}
.term .cur{display:inline-block;width:.55em;height:1em;background:#7dffc4;vertical-align:-2px;animation:blink 1s steps(1,end) infinite}
@keyframes blink{50%{opacity:0}}
.alertbox{border:2px solid var(--pink);background:var(--pink-soft);color:var(--pink-dark);
  padding:11px 14px;margin:0 0 14px;font-family:var(--mono);font-size:19px;line-height:1.4;box-shadow:var(--sh-sm)}
.alertbox b{font-family:var(--pixel);font-size:9px;line-height:1.8;display:block;margin-bottom:6px}

/* glitch heading */
.glitch{position:relative;display:inline-block}
.glitch.go::before,.glitch.go::after{content:attr(data-t);position:absolute;left:0;top:0;width:100%;pointer-events:none}
.glitch.go::before{color:var(--pink);clip-path:inset(0 0 56% 0);animation:gl1 .32s steps(2,end) 2}
.glitch.go::after{color:var(--teal);clip-path:inset(56% 0 0 0);animation:gl2 .32s steps(2,end) 2}
@keyframes gl1{0%,100%{transform:translate(0,0)}50%{transform:translate(-3px,-1px)}}
@keyframes gl2{0%,100%{transform:translate(0,0)}50%{transform:translate(3px,1px)}}

/* ---------------- clue ---------------- */
.clue{background:var(--teal-soft);border:2px dashed var(--teal);padding:16px 18px;margin:14px 0 4px;box-shadow:var(--sh-sm)}
.clue.gold{background:var(--gold-soft);border-color:var(--gold)}
.clue .riddle{font-family:var(--display);font-weight:600;font-size:1.1rem;line-height:1.5;margin:0}
.clue .eyebrow{background:transparent;border:0;box-shadow:none;padding:0;color:var(--teal-text);margin-bottom:9px}
.clue.gold .eyebrow{color:#8a5a10}

/* Core Guardian photo */
.guardian-photo{display:block;width:100%;max-width:250px;margin:14px auto 4px;border:2px solid var(--ink);box-shadow:var(--sh-sm)}
.guardian-ph{font-family:var(--mono);font-size:17px;line-height:1.35;color:var(--ink-dim);text-align:center;
  border:2px dashed var(--gold);background:var(--panel);padding:22px 14px;margin:14px auto 4px;max-width:300px}
.guardian-cap{text-align:center;font-size:.86rem;color:var(--ink-dim);margin:8px 0 0}

/* ---------------- puzzle ---------------- */
.qz{background:var(--panel-2);border:2px solid var(--ink);padding:15px;margin-top:14px;box-shadow:var(--sh-sm)}
.qz .qq{font-family:var(--display);font-weight:600;font-size:1.06rem;line-height:1.5;margin:0}
.cipher{font-family:var(--mono);font-size:clamp(24px,7vw,34px);letter-spacing:.16em;text-align:center;
  background:var(--panel);border:2px solid var(--ink);padding:12px;margin:12px 0 0;word-break:break-word}
.optgrid{display:grid;gap:10px;margin-top:14px}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;cursor:pointer;
  font-family:var(--display);font-weight:600;font-size:15px;
  border:2px solid var(--ink);background:var(--panel);padding:12px 13px;box-shadow:var(--sh-sm);
  transition:transform .1s,box-shadow .1s,background .14s}
.opt .kc{flex:none;width:30px;height:30px;display:grid;place-items:center;background:var(--ink);color:#fff;font-family:var(--pixel);font-size:10px}
.opt:hover{background:var(--bg-2);transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--rui-shadow)}
.opt:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--rui-shadow)}
.opt.bad{background:var(--pink-soft);border-color:var(--pink)}
.opt.good{background:var(--green-soft);border-color:var(--logo)}

/* decoder widgets */
.tool{margin-top:14px;border-top:2px dashed var(--ink);padding-top:13px}
.tool .tl{font-family:var(--pixel);font-size:8px;line-height:1.7;color:var(--ink-faint);margin-bottom:9px}
.dial{display:flex;gap:9px;align-items:stretch;justify-content:center;flex-wrap:wrap}
.dial .out{flex:1 1 170px;font-family:var(--mono);font-size:24px;letter-spacing:.14em;text-align:center;
  background:var(--panel);border:2px solid var(--ink);padding:9px 10px;word-break:break-all;min-width:150px}
.dial .sh{font-family:var(--pixel);font-size:10px;display:grid;place-items:center;background:var(--panel-2);border:2px solid var(--ink);padding:0 12px;min-width:64px}
.bits{display:flex;gap:8px;justify-content:center;margin-top:4px}
.bit{text-align:center;flex:0 0 auto}
.bit button{width:54px;height:50px;font-family:var(--pixel);font-size:15px;border:2px solid var(--ink);
  background:var(--panel);box-shadow:var(--sh-sm);cursor:pointer}
.bit button.on{background:var(--teal);color:#fff}
.bit button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--rui-shadow)}
.bit .pv{font-family:var(--mono);font-size:16px;color:var(--ink-faint);margin-top:4px}
.bitsum{font-family:var(--pixel);font-size:12px;text-align:center;margin-top:11px;color:var(--teal-text)}
.alpha{display:flex;gap:5px;overflow-x:auto;padding:2px 0 8px;-webkit-overflow-scrolling:touch}
.alpha span{flex:0 0 auto;border:2px solid var(--ink);background:var(--panel);padding:5px 6px;text-align:center;min-width:34px}
.alpha b{display:block;font-family:var(--display);font-size:14px}
.alpha i{display:block;font-family:var(--mono);font-size:15px;color:var(--ink-faint);font-style:normal}

.vision svg{width:100%;max-width:290px;height:auto;display:block;margin:12px auto 0;
  border:2px solid var(--ink);background:var(--panel);box-shadow:var(--sh-sm)}

details.hint{margin-top:13px;font-size:.9rem;color:var(--ink-dim);
  border:2px solid var(--ink);background:var(--panel-2);padding:10px 13px;box-shadow:var(--sh-sm)}
details.hint summary{cursor:pointer;font-family:var(--display);font-weight:700;font-size:13px;
  text-transform:uppercase;letter-spacing:.04em;color:var(--ink)}
details.hint p{margin:9px 0 0}

/* ---------------- forms / buttons ---------------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;
  font-family:var(--display);font-weight:700;font-size:15px;padding:13px 20px;min-height:48px;
  border:2px solid var(--ink);background:var(--panel);box-shadow:var(--sh-sm);
  transition:transform .1s,box-shadow .1s,background .14s}
.btn:hover:not(:disabled){transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--rui-shadow)}
.btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--rui-shadow)}
.btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:var(--pink);color:#fff}
.btn.primary:hover:not(:disabled){background:var(--pink-2)}
.btn.gold{background:var(--gold);color:var(--ink)}
.btn.danger{background:var(--panel);color:var(--pink-dark);border-color:var(--pink)}
.btn.small{padding:9px 13px;font-size:13.5px;min-height:42px}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.btnrow .btn{flex:1 1 auto}

input[type=text]{width:100%;font-family:var(--sans);font-size:16px;color:var(--ink);
  background:var(--panel);border:2px solid var(--ink);padding:13px;outline:none;appearance:none;-webkit-appearance:none}
input[type=text]:focus{box-shadow:3px 3px 0 var(--teal)}
input.ans{font-family:var(--mono);font-size:24px;letter-spacing:.1em;text-transform:uppercase;text-align:center}
label{display:block;font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.05em;
  text-transform:uppercase;color:var(--ink-dim);margin-bottom:7px}

.banner{border:2px solid var(--ink);background:var(--panel);padding:11px 14px;margin-bottom:14px;font-size:.9rem;box-shadow:var(--sh-sm)}
.banner.warn{background:var(--gold-soft);border-color:var(--gold)}
.banner.bad{background:var(--pink-soft);border-color:var(--pink);color:var(--pink-dark)}

a:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--teal);outline-offset:2px}

/* shake + flash feedback */
@keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.shake{animation:shk .42s ease}
#flash{position:fixed;inset:0;z-index:40;pointer-events:none;opacity:0;background:var(--pink)}
#flash.go{animation:fl .4s ease}
@keyframes fl{0%{opacity:.34}100%{opacity:0}}

/* ---------------- organiser ---------------- */
.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}
.tab{font-family:var(--display);font-weight:700;font-size:13.5px;padding:10px 14px;cursor:pointer;
  border:2px solid var(--ink);background:var(--panel);color:var(--ink-dim);box-shadow:var(--sh-sm)}
.tab.active{background:var(--teal);color:#fff}
.simgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin:12px 0}
.simbtn{border:2px solid var(--ink);background:var(--panel);padding:11px 8px;cursor:pointer;text-align:center;box-shadow:var(--sh-sm)}
.simbtn .n{display:block;font-family:var(--pixel);font-size:13px}
.simbtn .k{display:block;font-size:.7rem;color:var(--ink-dim);margin-top:6px;line-height:1.3}
.simbtn.next{border-color:var(--pink);box-shadow:inset 0 0 0 2px var(--pink),var(--sh-sm)}
.simbtn.done{background:var(--teal-soft)}
.simbtn.master{border-color:var(--gold)}
.simlog{list-style:none;margin:14px 0 0;padding:0;font-family:var(--mono);font-size:16px}
.simlog li{padding:6px 10px;border-left:4px solid var(--ink);margin-bottom:5px;background:var(--panel-2)}
.simlog li.ok{border-left-color:var(--teal)}
.simlog li.err{border-left-color:var(--pink)}
.simlog li.gold{border-left-color:var(--gold)}
.testlist{list-style:none;margin:14px 0 0;padding:0}
.testlist li{padding:9px 11px;border-bottom:2px solid var(--bg-2);font-size:.9rem;display:flex;gap:10px;align-items:baseline}
.testlist .mark{font-weight:700;flex:0 0 auto;font-family:var(--pixel);font-size:11px}
.testlist li.pass .mark{color:var(--teal-text)}
.testlist li.fail .mark{color:var(--pink)}
.testlist .terr{color:var(--pink-dark);font-size:.8rem}
.urlrow{font-family:var(--mono);font-size:15px;word-break:break-all;color:var(--ink-dim);margin-top:6px}

/* ---------------- printable QR sheet (paper: always plain) ---------------- */
.sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:16px;margin-top:16px}
.qcard{background:#fff;color:#14181f;border:3px solid #14181f;padding:16px;text-align:center;
  break-inside:avoid;page-break-inside:avoid}
.qcard.master{border-color:#8a5a10;box-shadow:inset 0 0 0 3px #f7e3b0}
.qcard .qhead{font-family:var(--pixel);font-size:7px;line-height:1.8;color:#5b6470}
.qcard.master .qhead{color:#8a5a10}
.qcard .qnum{font-family:var(--pixel);font-size:20px;line-height:1.4;margin-top:8px}
.qcard svg{width:100%;max-width:236px;height:auto;display:block;margin:10px auto}
.qcard .qloc{font-family:var(--display);font-size:1.02rem;font-weight:700;margin:2px 0}
.qcard .qkey{font-family:var(--mono);font-size:17px;color:#39414c;margin-top:6px}
.qcard .qnote{font-size:.7rem;color:#5b6470;margin-top:8px;border-top:1px dashed #c6ccd4;padding-top:6px}
.qcard .qurl{font-size:.56rem;color:#8a919b;word-break:break-all;margin-top:4px}

@media print{
  body{background:#fff}
  body::before,.crt,header.top,footer.foot,.tabs,.no-print,.banner,#flash{display:none !important}
  .wrap,.wrap.wide{max-width:none;padding:0}
  .card{border:0;box-shadow:none;padding:0}
  .sheet{grid-template-columns:1fr 1fr;gap:8mm}
}

/* ---------------- finale ---------------- */
.ticket{border:3px solid var(--gold);background:var(--gold-soft);padding:22px 18px;text-align:center;
  margin-bottom:16px;box-shadow:var(--sh)}
.ticket .big{font-family:var(--pixel);font-size:clamp(13px,4.2vw,19px);line-height:1.6;color:var(--ink);margin:10px 0 6px}
.ticket .code{font-family:var(--pixel);font-size:clamp(18px,6vw,26px);line-height:1.5;letter-spacing:.06em;
  color:var(--pink);background:var(--panel);border:2px solid var(--ink);display:inline-block;padding:12px 16px;margin:12px 0;box-shadow:var(--sh-sm)}
.recap{list-style:none;margin:12px 0 0;padding:0;font-family:var(--mono);font-size:17px}
.recap li{display:flex;gap:10px;padding:7px 0;border-bottom:2px dashed var(--bg-2)}
.recap .rn{font-family:var(--pixel);font-size:9px;color:var(--teal-text);flex:0 0 2.4em;padding-top:3px}
.recap .rt{margin-left:auto;color:var(--ink-faint);font-variant-numeric:tabular-nums}

#confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
#confetti i{position:absolute;top:-4vh;width:11px;height:11px;display:block;border:1px solid rgba(23,19,31,.5);
  animation:fall 3.4s linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(680deg);opacity:.1}}

body.reduce-motion *,body.reduce-motion *::before,body.reduce-motion *::after{animation:none !important;transition:none !important}
body.reduce-motion #confetti{display:none}
@media (prefers-reduced-motion:reduce){
  *{animation:none !important;transition:none !important}
  #confetti{display:none}
}
@media (max-width:420px){
  .hud .hv{font-size:11px}
  .nm .t{display:none}
  .brand{font-size:10px}
}

/* ============================================================
   EVENT CONFIGURATION — edit this block for your event.

   eventUrl : THE most important setting. Put the exact public
     address players' phones will open (your deployed Apps Script
     web-app URL, ending in /exec). Every printed QR encodes THIS,
     so a QR is never tied to whatever address you happened to be
     browsing. Leave "" only if you will paste the address into
     the Print QR sheet tab by hand.
   seed : changes all manual keys (k=) — reprint the sheet after.
   checkpoints : 1–6 are field nodes; each "clue" is the riddle
     that LEADS players TO that node. №7 is the NEXUS Core,
     carried by the volunteer (the "Core Guardian").
   coreGuardian.photo : the volunteer's photo for the final clue.
     Add it later as either
       "volunteer.jpg"             — file next to this page, or
       "data:image/jpeg;base64,…"  — pasted data URI (works
                                     everywhere incl. Apps Script).
     Leave "" to show a player-safe fallback until it is ready.
   challenges : one NEXUS puzzle per STEP (1–7). Story order is
     the same for every player even though the physical route is
     randomised, because challenges attach to steps, not places.
   ============================================================ */

  eventName: "NEXUS Protocol",

     the host would be un-fixable once they are on paper — which is exactly
     what saved us on 28 Aug 2026, when the host constant turned out to name
     a repo (hash-play) that had never existed.

     /a/<domain>/… variant works too but is 22 characters longer, which
     makes every printed QR denser.

<script id="qrhunt-qrgen">
/* ============================================================
   QRGen — self-contained QR Code encoder (byte mode, versions
   1–10, ECC L/M/Q/H, automatic mask selection) plus a
   structural verifier used by the built-in self-test.
   Algorithm follows ISO/IEC 18004 (model 2).
   ============================================================ */
(function (g) {
  'use strict';

  var ECL_FORMAT_BITS = { L: 1, M: 0, Q: 3, H: 2 };
  var MIN_VERSION = 1, MAX_VERSION = 10;

  var ECC_CODEWORDS_PER_BLOCK = {
    L: [-1, 7, 10, 15, 20, 26, 18, 20, 24, 30, 18],
    M: [-1, 10, 16, 26, 18, 24, 16, 18, 22, 22, 26],
    Q: [-1, 13, 22, 18, 26, 18, 24, 18, 22, 20, 24],
    H: [-1, 17, 28, 22, 16, 22, 28, 26, 26, 24, 28]
  };
  var NUM_ERROR_CORRECTION_BLOCKS = {
    L: [-1, 1, 1, 1, 1, 1, 2, 2, 2, 2, 4],
    M: [-1, 1, 1, 1, 2, 2, 4, 4, 4, 5, 5],
    Q: [-1, 1, 1, 2, 2, 4, 4, 6, 6, 8, 8],
    H: [-1, 1, 1, 2, 4, 4, 4, 5, 6, 8, 8]
  };

  function getNumRawDataModules(ver) {
    var result = (16 * ver + 128) * ver + 64;
    if (ver >= 2) {
      var numAlign = Math.floor(ver / 7) + 2;
      result -= (25 * numAlign - 10) * numAlign - 55;
      if (ver >= 7) result -= 36;
    }
    return result;
  }
  function getNumDataCodewords(ver, ecl) {
    return Math.floor(getNumRawDataModules(ver) / 8) -
      ECC_CODEWORDS_PER_BLOCK[ecl][ver] * NUM_ERROR_CORRECTION_BLOCKS[ecl][ver];
  }

  /* ---- GF(256) Reed–Solomon, modulus 0x11D ---- */
  function rsMultiply(x, y) {
    var z = 0;
    for (var i = 7; i >= 0; i--) {
      z = (z << 1) ^ ((z >>> 7) * 0x11D);
      z ^= ((y >>> i) & 1) * x;
    }
    return z & 0xFF;
  }
  function rsComputeDivisor(degree) {
    var result = [];
    for (var i = 0; i < degree - 1; i++) result.push(0);
    result.push(1);
    var root = 1;
    for (var j = 0; j < degree; j++) {
      for (var k = 0; k < result.length; k++) {
        result[k] = rsMultiply(result[k], root);
        if (k + 1 < result.length) result[k] ^= result[k + 1];
      }
      root = rsMultiply(root, 0x02);
    }
    return result;
  }
  function rsComputeRemainder(data, divisor) {
    var result = divisor.map(function () { return 0; });
    for (var i = 0; i < data.length; i++) {
      var factor = data[i] ^ result.shift();
      result.push(0);
      for (var j = 0; j < divisor.length; j++) result[j] ^= rsMultiply(divisor[j], factor);
    }
    return result;
  }

  /* ---- UTF-8 (no TextEncoder dependency) ---- */
  function toUtf8Bytes(str) {
    var out = [];
    for (var i = 0; i < str.length; i++) {
      var cp = str.codePointAt(i);

/* ============================================================

   - `total` codes; steps 1..total-1 are a per-player random

      /* misconfigured event (no challenge defined for this step): degrade
         gracefully instead of dead-locking the player — auto-clear the gate */
      s.solved = step; store.save(s);
      renderHome(); return;
    }
    if (ch.confirm && !coreArmed) { renderCoreConfirm(s, o.hesitated, o.blocked); return; }
    if (o.fresh) { dialShift = 0; bitState = []; }

    var head = o.fresh ? freshStamp(step)
      : o.blocked ? '<span class="stamp warn">SCANNER JAMMED</span>'
      : '<span class="stamp neutral">CHALLENGE ACTIVE</span>';
    var blockedNote = o.blocked
      ? '<div class="banner warn">NEXUS is jamming your scanner &mdash; clear the active challenge before scanning another node.</div>'
      : '';
    var lastId = s.scans[s.scans.length - 1].id;
    var failNote = '';
    if (o.failed) {
      var n = attempts[step] || 1;
      failNote = nexusSays(ch.fail[Math.min(n - 1, ch.fail.length - 1)], true);
    }

    var body = '';
    if (ch.type === 'choice') {
      for (var i = 0; i < ch.options.length; i++) {
        body += '<button class="opt" type="button" data-action="ans" data-i="' + i + '">' +
          '<span class="kc">' + String.fromCharCode(65 + i) + '</span><span>' + esc(ch.options[i]) + '</span></button>';
      }
      body = '<div class="optgrid">' + body + '</div>';
    } else {
      body = '<form id="quizform">' +
        '<label for="quizans">Your answer</label>' +
        '<input type="text" id="quizans" class="ans" autocomplete="off" autocapitalize="characters" value="' + esc(o.typed || '') + '" placeholder="' + esc(ch.placeholder || 'answer') + '">' +
        '<div class="btnrow"><button class="btn primary" type="submit">Transmit</button></div>' +
        '</form>';
    }

    render(storageBanner() + blockedNote +
      '<div class="card" id="chCard">' + head +
      hudHtml(s) + nodeMapHtml(s, o.fresh ? lastId : 0) +
      '<div class="eyebrow">' + esc(ch.system) + '</div>' +
      '<h1><span class="glitch" data-t="' + esc(ch.title) + '">' + esc(ch.title) + '</span></h1>' +
      (ch.alert ? alertBox(!!o.fresh) : '') +
      '<p class="dim small">Node &#8470;' + lastId + ' &middot; ' + esc(cp(lastId).location) + ' &mdash; signal intercepted.</p>' +
      '<p>' + esc(ch.brief) + '</p>' +
      failNote +
      '<div class="qz"><p class="qq">' + esc(ch.question) + '</p>' +
      (ch.cipher ? '<p class="cipher">' + esc(ch.cipher) + '</p>' : '') +
      (ch.art === 'vision' ? visionArt() : '') +
      widgetHtml(ch) +
      body + '</div>' +
      (ch.hint ? '<details class="hint"' + (o.hintOpen ? ' open' : '') + '><summary>Need a hint?</summary><p>' + esc(ch.hint) + '</p></details>' : '') +
      (step === 1 ? '<details class="hint"><summary>Mission briefing &amp; rules</summary>' + briefRulesHtml() + '</details>' : '') +
      (o.fresh && step === 1 && lastId !== 1
        ? '<p class="dim small">Started mid-route? If you had already scanned other nodes on this phone, your browser lost its progress &mdash; tell a crew member.</p>'
        : '') +
      '</div>');
    renderedStep = step;
    startClock();

    if (ch.type === 'text') {
      var form = document.getElementById('quizform');
      if (form) form.addEventListener('submit', function (ev) {
        ev.preventDefault();
        submitAnswer(document.getElementById('quizans').value);
      });
    }
  }

  /* live widgets update in place (no re-render, so typing is never lost) */
  function dialTurn(d) {
    var s = store.load(), step = pendingStep(s);
    var ch = step ? challengeFor(step) : null;
    if (!ch || ch.widget !== 'caesar') return;
    dialShift = (dialShift + d + 26) % 26;
    var out = document.getElementById('dialOut'), sh = document.getElementById('dialShift');
    if (out) out.textContent = caesar(ch.cipher, dialShift);
    if (sh) sh.textContent = '+' + dialShift;
    sfx('tap');
  }
  function bitFlip(i) {
    var s = store.load(), step = pendingStep(s);
    var ch = step ? challengeFor(step) : null;
    if (!ch || ch.widget !== 'binary') return;
    bitState[i] = !bitState[i];
    var btns = document.querySelectorAll('[data-action="bit"]');
    var bits = String(ch.bits || '1101').split('');
    var n = bits.length, sum = 0;
    for (var j = 0; j < n; j++) {
      if (btns[j]) { btns[j].textContent = bitState[j] ? '1' : '0'; btns[j].className = bitState[j] ? 'on' : ''; }
      if (bitState[j]) sum += Math.pow(2, n - 1 - j);
    }
    var el = document.getElementById('bitSum');
    if (el) el.textContent = 'TOTAL = ' + sum;
    sfx('tap');
  }

  function shakeIt() {
    if (!hasDoc) return;
    var c = document.getElementById('chCard');
    if (c && motionOK()) { c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake'); }
    var f = document.getElementById('flash');
    if (f && motionOK()) { f.classList.remove('go'); void f.offsetWidth; f.classList.add('go'); }
    var gl = document.querySelector('.glitch');
    if (gl && motionOK()) { gl.classList.remove('go'); void gl.offsetWidth; gl.classList.add('go'); }
  }

  function submitAnswer(given) {
    var s = store.load();
    var step = pendingStep(s);
    if (!step) { renderHome(); return; }
    if (renderedStep !== step) {
      /* the on-screen challenge is stale (another tab moved the session on) —
         show the current one instead of mis-scoring the answer */
      renderChallenge(s, {});
      return;
    }
    var ch = challengeFor(step);
    if (!checkAnswer(ch, given)) {
      attempts[step] = (attempts[step] || 0) + 1;
      sfx('bad');
      var hd = null;
      try { hd = document.querySelector('details.hint'); } catch (e) {}
      renderChallenge(s, { failed: true, typed: (ch.type === 'text' ? given : null), hintOpen: !!(hd && hd.open) });
      shakeIt();
      return;
    }
    s.solved = step;
    store.save(s);
    if (step === TOTAL) { sfx('win'); renderFinale(s, true); return; }
    sfx('good');
    renderCleared(s, ch, step);
  }

  function renderCleared(s, ch, step) {
    var target = Game.nextTarget(s);
    var stamp;
    if (step === 1) stamp = '<span class="stamp ok">ACCESS GRANTED</span>';
    else if (step === TOTAL - 1) stamp = '<span class="stamp gold">ALL ' + SYSTEMS + ' SYSTEMS RESTORED</span>';
    else stamp = '<span class="stamp ok">SYSTEM RESTORED &middot; ' + (step - 1) + '/' + SYSTEMS + '</span>';
    render(storageBanner() +
      '<div class="card">' + stamp +
      hudHtml(s) + nodeMapHtml(s) +
      '<h1>' + esc(ch.clearTitle || 'Challenge cleared.') + '</h1>' +
      nexusSays(ch.success, true) +
      clueCard(target) +
      '<p class="dim small">Find that spot, then scan the QR code waiting there.</p>' +
      '</div>');
    startClock();
    confetti(10);
  }

  /* ---------- rejection / edge screens (engine statuses) ---------- */
  function renderResult(res) {
    var s = res.session;
    var target = s ? Game.nextTarget(s) : null;
    var body = '';

    switch (res.status) {
      /* accepted statuses normally route to renderChallenge in handleScan;
         kept here as a safe fallback */
      case 'started': case 'advanced': case 'final-clue': case 'completed':
        return renderChallenge(s, { fresh: true });
      case 'already-completed':
        if (pendingStep(s)) return renderChallenge(s, {});
        return renderFinale(s, false);
      case 'repeat':
        sfx('tap');
        body = '<span class="stamp neutral">ALREADY SECURED</span>' + hudHtml(s) + nodeMapHtml(s) +
          '<h1>You are standing on your last node.</h1>' +
          '<p>No harm done &mdash; here is your clue again.</p>' + clueCard(target);
        break;
      case 'visited':
        sfx('bad');
        body = '<span class="stamp warn">NODE ALREADY SECURED</span>' + hudHtml(s) + nodeMapHtml(s) +
          '<h1>This node is already in your log.</h1>' +
          nexusSays('Going in circles already? Incorrect sequence.', true) +
          '<p>Incorrect sequence! Follow your current clue to find your next node.</p>' + clueCard(target);
        break;
      case 'wrong':
        sfx('bad');
        body = '<span class="stamp err">INCORRECT SEQUENCE</span>' + hudHtml(s) + nodeMapHtml(s) +
          '<h1>Not this node &mdash; not yet.</h1>' +
          nexusSays('Wrong node, human. I rerouted you kilometres ago.', true) +
          '<p>Incorrect sequence! Follow your current clue to find your next node.</p>' + clueCard(target);
        break;
      case 'master-early':
        sfx('bad');
        body = '<span class="stamp gold">CORE FIREWALL ACTIVE</span>' + hudHtml(s) + nodeMapHtml(s) +
          '<h1>The core is still shielded.</h1>' +
          nexusSays('You cannot touch my core while my field systems stand.', true) +
          '<p>The core only opens after all ' + (TOTAL - 1) + ' field nodes are secured. You have found ' + s.scans.length + ' so far.</p>' +
          clueCard(target);
        break;
      case 'master-first':
        body = '<span class="stamp gold">CORE FIREWALL ACTIVE</span>' + nodeMapHtml(null) +
          '<h1>That is the core itself!</h1>' +
          nexusSays('Bold. But my core answers only to those who dismantle my defences first.', true) +
          '<p>Scan <strong>QR &#8470;1</strong> at the mission briefing point (any field node also works) to begin your mission.</p>';
        break;
      case 'bad-key':
        sfx('bad');
        body = '<span class="stamp err">SIGNAL REJECTED</span>' +
          '<h1>That code did not check out.</h1>' +
          '<p>It is not a valid node code for this mission. Find an official node card and scan its QR.</p>';
        break;
      default: /* unknown */
        sfx('bad');
        body = '<span class="stamp err">SIGNAL REJECTED</span>' +
          '<h1>That is not part of this mission.</h1>' +
          '<p>Find an official node card and scan its QR code.</p>';
    }
    render(storageBanner() + '<div class="card">' + body + '</div>');
    startClock();
  }

  function renderFinale(s, fresh) {
    if (pendingStep(s)) return renderChallenge(s, {});
    var code = Game.completionCode(s, CFG.seed);
    var boss = challengeFor(TOTAL);
    var recap = '';
    for (var i = 0; i < s.scans.length; i++) {
      var c = cp(s.scans[i].id);
      recap += '<li><span class="rn">' + pad2(i + 1) + '</span><span>' + esc(c ? c.location : ('Node ' + s.scans[i].id)) +
        '</span><span class="rt">' + fmtClock(s.scans[i].at) + '</span></li>';
    }
    render(storageBanner() +
      (fresh ? nexusSays((boss && boss.success) || 'NO— no no NO— [connection terminated]', true) : '') +
      '<div class="ticket">' +
      '<div class="eyebrow">MISSION COMPLETE &middot; ALL ' + TOTAL + ' NODES</div>' +
      '<div class="big">NEXUS OFFLINE<br>ALL SYSTEMS RESTORED</div>' +
      '<p class="dim small">You are the winner. Show this screen to the Core Guardian to claim your reward.</p>' +
      '<div class="code">' + code + '</div>' +
      '<p class="dim small">Shutdown code &middot; mission time <strong>' + fmtDur((s.completedAt || 0) - s.startedAt) + '</strong></p>' +
      nodeMapHtml(s) +
      '</div>' +
      '<div class="card"><h2>Recovery log</h2><ul class="recap">' + recap + '</ul>' +
      '<div class="btnrow no-print"><button class="btn" data-action="reset-player">Start a fresh mission</button></div>' +
      '</div>');
    if (fresh) confetti(90);
  }

  function confetti(n) {
    if (!hasDoc || !motionOK()) return;
    var host = document.getElementById('confetti');
    if (!host) return;
    var colors = ['#E94560', '#0FA6AE', '#F4A400', '#00b874', '#17131f', '#ff5c78'];
    var html = '';
    for (var i = 0; i < n; i++) {
      html += '<i style="left:' + (Math.random() * 100).toFixed(1) + 'vw;background:' +
        colors[i % colors.length] + ';animation-delay:' + (Math.random() * 0.9).toFixed(2) +
        's;transform:rotate(' + Math.floor(Math.random() * 360) + 'deg)"></i>';
    }
    host.innerHTML = html;
    setTimeout(function () { host.innerHTML = ''; }, 4700);
  }

  /* mission clock ticks in the HUD */
  var clockTimer = null;
  function startClock() {
    if (!hasDoc) return;
    if (clockTimer) { clearInterval(clockTimer); clockTimer = null; }
    clockTimer = setInterval(function () {
      var el = document.getElementById('hudTime');
      if (!el) { clearInterval(clockTimer); clockTimer = null; return; }
      el.textContent = missionClock(store.load());
    }, 1000);
  }

  /* ---------- crew tools ---------- */
  var simLog = [];
  var sheetBase = null;
  var autoTimer = null;
  var orgUnlocked = false;

  function defaultBase() {
    if (CFG.eventUrl) return String(CFG.eventUrl).trim();
    try {
      if (g.location && g.location.protocol !== 'file:') return g.location.origin + g.location.pathname;
    } catch (e) { /* headless */ }
    return '';
  }

  function renderCrewGate(msg) {
    document.getElementById('shell').className = 'wrap';
    render('<div class="card"><h1>Crew access</h1>' +
      '<p class="dim">Crew tools are for event crew only &mdash; the simulator can complete a mission. Enter the crew code (set as <span class="mono">crewCode</span> in the config block).</p>' +
      (msg ? '<div class="banner bad">' + esc(msg) + '</div>' : '') +
      '<form id="crewform">' +
      '<label for="crewcode">Crew code</label>' +
      '<input type="text" id="crewcode" autocomplete="off">' +
      '<div class="btnrow"><button class="btn primary" type="submit">Unlock</button>' +
      '<button class="btn" type="button" data-action="home">Back</button></div>' +
      '</form></div>');
    var form = document.getElementById('crewform');
    if (form) form.addEventListener('submit', function (ev) {
      ev.preventDefault();
      var v = document.getElementById('crewcode').value.trim();
      if (v.toUpperCase() === String(CFG.crewCode).toUpperCase()) { orgUnlocked = true; renderOrganiser('sim'); }
      else renderCrewGate('Wrong code.');
    });
  }

  function renderOrganiser(tab) {
    if (CFG.crewCode && !orgUnlocked) { renderCrewGate(); return; }
    document.getElementById('shell').className = 'wrap wide';
    var tabs = [['sheet', 'Print QR sheet'], ['sim', 'Simulator'], ['test', 'Self-test'], ['guide', 'Event guide']];
    var th = '';
    for (var i = 0; i < tabs.length; i++) {
      th += '<button class="tab' + (tab === tabs[i][0] ? ' active' : '') + '" data-action="tab" data-tab="' + tabs[i][0] + '">' + tabs[i][1] + '</button>';
    }
    var inner = '';
    if (tab === 'sim') inner = simView();
    else if (tab === 'sheet') inner = sheetView();
    else if (tab === 'test') inner = testView(null);
    else inner = guideView();
    render('<div class="banner warn no-print">Crew tools &mdash; for event crew. Players never need this page.</div>' +
      '<div class="tabs no-print">' + th + '</div>' + inner +
      '<p class="no-print"><a data-action="home" tabindex="0" role="button">&larr; Back to player view</a></p>');
    wireOrganiser(tab);
  }

  function simView() {
    var s = store.load();
    var state;
    if (!s) state = '<p class="dim">No active player session in this browser. Tap any node below to start one &mdash; exactly what happens when a player scans their first QR. Challenges are auto-cleared in the simulator.</p>';
    else {
      var seq = [];
      for (var i = 0; i < s.path.length; i++) {
        var done = i < s.scans.length;
        seq.push(done ? '<strong>' + s.path[i] + '</strong>' : String(s.path[i]));
      }
      state = '<p>' + (s.completedAt ? 'Mission <strong>complete</strong>.' : 'Step <strong>' + s.scans.length + ' of ' + TOTAL + '</strong> &middot; next expected: <strong>&#8470;' +
        Game.nextTarget(s) + '</strong>') + '</p>' +
        '<p class="small dim">This player&rsquo;s secret trail: ' + seq.join(' &rarr; ') + '</p>' + nodeMapHtml(s);
    }
    var btns = '';
    for (var id = 1; id <= TOTAL; id++) {
      var cls = 'simbtn';
      if (s && Game.nextTarget(s) === id) cls += ' next';
      if (s && s.scans.some(function (sc) { return sc.id === id; })) cls += ' done';
      if (id === CORE) cls += ' master';
      btns += '<button class="' + cls + '" data-action="simscan" data-id="' + id + '">' +
        '<span class="n">&#8470;' + id + '</span><span class="k">' + esc(cp(id).location) + '</span></button>';
    }
    var log = '';
    for (var j = 0; j < simLog.length; j++) log += simLog[j];
    return '<div class="card"><h2>Player simulator</h2>' +
      '<p class="dim small">Simulates real scans against this browser&rsquo;s player session &mdash; same engine, same rules. The highlighted card is the expected next node; tapping anything else should be rejected. (Challenges are auto-cleared here so you can test routing quickly; play the real flow by scanning or entering codes as a player.)</p>' +
      state +
      '<div class="simgrid">' + btns + '</div>' +
      '<div class="btnrow">' +
      '<button class="btn primary" data-action="autoplay"' + (autoTimer ? ' disabled' : '') + '>Auto-play full mission</button>' +
      '<button class="btn danger" data-action="reset-player">Reset player session</button>' +
      '</div>' +
      '<ul class="simlog" id="simlog">' + log + '</ul></div>';
  }

  function simLogPush(kind, text) {
    simLog.unshift('<li class="' + kind + '">' + text + '</li>');
    if (simLog.length > 24) simLog.pop();
  }

  /* simulator scan: engine rules untouched; the step challenge is auto-cleared */
  function simScan(id) {
    var res = doScan(id, keyOf(id));
    if (res.session && ACCEPTED[res.status]) {
      res.session.solved = res.session.scans.length;
      store.save(res.session);
    }
    return res;
  }

  function describeResult(id, res) {
    var map = {
      'started': ['ok', 'started the mission (step 1, challenge auto-cleared)'],
      'advanced': ['ok', 'accepted (step ' + (res.session ? res.session.scans.length : '?') + ', challenge auto-cleared)'],
      'final-clue': ['gold', 'accepted &mdash; ' + (TOTAL - 1) + 'th node, core exposed'],
      'completed': ['gold', 'accepted &mdash; MISSION COMPLETE'],
      'repeat': ['err', 'repeat of current node (harmless)'],
      'visited': ['err', 'rejected &mdash; already secured'],
      'wrong': ['err', 'rejected &mdash; incorrect sequence'],
      'master-early': ['err', 'rejected &mdash; core locked until ' + (TOTAL - 1) + ' scans'],
      'master-first': ['err', 'rejected &mdash; cannot start at the core'],
      'bad-key': ['err', 'rejected &mdash; bad key'],
      'unknown': ['err', 'rejected &mdash; unknown code'],
      'already-completed': ['gold', 'mission already complete']
    };
    var d = map[res.status] || ['err', res.status];
    simLogPush(d[0], 'Scanned &#8470;' + id + ' &mdash; ' + d[1]);
  }

  function sheetView() {
    var base = sheetBase != null ? sheetBase : defaultBase();
    var problem = baseProblem(base);
    var caution = problem ? null : baseCaution(base);
    var cards = '';
    if (!problem) {
      for (var i = 0; i < CFG.checkpoints.length; i++) {
        var c = CFG.checkpoints[i];
        var url = scanUrl(base, c.id);
        var svg, qerr = '';
        try { svg = QRGen.encodeText(url, { ecl: 'M' }).toSvg({ border: 3 }); }
        catch (e) { svg = ''; qerr = String(e && e.message || e); }
        var master = c.id === CORE;
        var note = master ? 'Scan with your phone camera to play'
          : c.id === 1 ? 'Scan with your phone camera to play &middot; show this card at the mission briefing &mdash; agents scan it first'
          : 'Scan with your phone camera to play &middot; place this card at: ' + esc(c.location);
        cards += '<div class="qcard' + (master ? ' master' : '') + '">' +
          '<div class="qhead">' + (master ? 'NEXUS CORE &middot; STAYS WITH THE VOLUNTEER' : esc(CFG.eventName)) + '</div>' +
          '<div class="qnum">&#8470;' + c.id + '</div>' +
          (svg || '<p class="terr">QR error: ' + esc(qerr) + '</p>') +
          '<div class="qloc">' + esc(c.location) + '</div>' +
          '<div class="qkey">Manual code: ' + c.id + '-' + keyOf(c.id) + '</div>' +
          '<div class="qnote">' + note + '</div>' +
          '<div class="qurl">' + esc(url) + '</div>' +
          '</div>';
      }
    }
    var test = (!problem)
      ? '<p class="no-print small dim" style="margin-top:12px">Before printing, open a card&rsquo;s address on a phone once to prove it works: <span class="urlrow">' + esc(scanUrl(base, 1)) + '</span></p>'
      : '';
    return '<div class="card"><h2>Printable QR sheet</h2>' +
      '<p class="dim small">Every card encodes <strong>the address below</strong> plus its node number and key &mdash; not the address you happen to be browsing. Print, cut, and place: &#8470;1 at the briefing point, &#8470;2&ndash;' + (TOTAL - 1) + ' at their locations, and &#8470;' + CORE + ' goes to the volunteer Core Guardian.</p>' +
      (problem ? '<div class="banner bad"><strong>These QR codes would not work.</strong><br>' + problem + '</div>' : '') +
      (caution ? '<div class="banner warn">' + caution + '</div>' : '') +
      '<label for="baseurl">Address players will open (set <span class="mono">eventUrl</span> in the config to make this permanent)</label>' +
      '<input type="text" id="baseurl" value="' + esc(base) + '" placeholder="https://script.google.com/macros/s/…/exec">' +
      '<div class="btnrow"><button class="btn" data-action="sheet-refresh">Update cards</button>' +
      '<button class="btn primary" data-action="print"' + (problem ? ' disabled' : '') + '>Print sheet</button></div>' +
      test +
      '</div>' +
      (problem ? '<div class="card"><p class="dim">Fix the address above to generate the cards.</p></div>'
               : '<div class="sheet">' + cards + '</div>');
  }

  function testView(results) {
    var body;
    if (!results) {
      body = '<p class="dim small">Runs the game-rule checks (randomized trails, strict sequence validation, the ' + (TOTAL - 1) + 'th&rarr;' + TOTAL + 'th convergence, challenge gating) plus a structural read-back of every generated QR code &mdash; all inside this browser.</p>' +
        '<div class="btnrow"><button class="btn primary" data-action="runtests">Run all checks</button></div>';
    } else {
      var pass = results.filter(function (r) { return r.ok; }).length;
      var items = '';
      for (var i = 0; i < results.length; i++) {
        var r = results[i];
        items += '<li class="' + (r.ok ? 'pass' : 'fail') + '"><span class="mark">' + (r.ok ? 'OK' : 'X') + '</span><span>' +
          esc(r.name) + (r.ok ? '' : '<br><span class="terr">' + esc(r.err || '') + '</span>') + '</span></li>';
      }
      body = '<p><strong>' + pass + ' / ' + results.length + ' checks passed.</strong>' +
        (pass === results.length ? ' All game rules verified.' : ' Investigate the failures below.') + '</p>' +
        '<ul class="testlist">' + items + '</ul>' +
        '<div class="btnrow"><button class="btn" data-action="runtests">Run again</button></div>';
    }
    return '<div class="card"><h2>Self-test</h2>' + body + '</div>';
  }

  function guideView() {
    return '<div class="card"><h2>Event guide</h2>' +
      '<p><strong>1. Set the address.</strong> Put your deployed web-app URL in <span class="mono">eventUrl</span> in the config block at the top of the file. Every QR then encodes that address, no matter where you print from. This is the single most common reason scanned QR codes fail.</p>' +
      '<p><strong>2. Customise.</strong> Same block: locations, clue riddles, NEXUS challenges, event name, seed and crew code. Add the volunteer&rsquo;s photo as <span class="mono">coreGuardian.photo</span> (a filename next to the page, or a pasted data URI).</p>' +
      '<p><strong>3. Host.</strong> For the live event, serve it from the club website (Apps Script) &mdash; see the integration guide in the project folder. For a same-Wi-Fi rehearsal, run <span class="mono">start-server.ps1</span>.</p>' +
      '<p><strong>4. Prove one code.</strong> Open a card&rsquo;s address on a phone (mobile data, not Wi-Fi) before printing 7 cards.</p>' +
      '<p><strong>5. Place.</strong> &#8470;1 is shown at the mission briefing (every agent scans it first). &#8470;2&ndash;' + (TOTAL - 1) + ' go to: Library, Front Gate, 8th Floor, Quadrangle, Old Auditorium/Back Gate. &#8470;' + CORE + ' stays with the volunteer Core Guardian &mdash; every agent&rsquo;s ' + (TOTAL - 1) + 'th step sends them hunting for that person.</p>' +
      '<p><strong>6. Play.</strong> Agents scan &#8470;1, pass the authentication challenge, and follow their personal clue trail, solving a NEXUS challenge at every node. Tell players to keep using the same browser for every scan &mdash; progress lives in that browser.</p>' +
      '<p><strong>7. Verify.</strong> Finishers show the MISSION COMPLETE screen; the Core Guardian checks the shutdown code and mission time, then hands over the prize.</p>' +
      '</div>';
  }

  function wireOrganiser(tab) {
    if (tab === 'sheet') {
      var input = document.getElementById('baseurl');
      /* record only — re-rendering on 'change' detaches the Print button
         mid-click and swallows the press; Update/Print re-render instead */
      if (input) input.addEventListener('input', function () {
        sheetBase = input.value.trim();
      });
    }
  }

  function stopAutoPlay() {
    if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
  }

  function autoPlay() {
    if (autoTimer) return;
    var s = store.load();
    if (s && s.completedAt) {
      if (g.confirm && !g.confirm('A completed mission is stored in this browser. Clear it and run the auto-play demo?')) return;
      store.clear(); attempts = {}; coreArmed = false;
      simLogPush('gold', 'Previous completed session cleared for auto-play.');
    }
    autoTimer = setInterval(function () {
      var cur = store.load();
      var target = cur ? Game.nextTarget(cur) : (1 + Math.floor(Math.random() * (TOTAL - 1)));
      if (target == null) { stopAutoPlay(); renderOrganiser('sim'); return; }
      var res = simScan(target);
      describeResult(target, res);
      if (res.status === 'completed' || res.status === 'already-completed') stopAutoPlay();
      renderOrganiser('sim');
    }, 550);
    renderOrganiser('sim');
  }

  /* ---------- self-test suite (also run headlessly by tests/run_tests.py) ---------- */
  var SelfTest = {
    samplePayloads: function () {
      var base = 'http://192.168.1.5:8080/';
      var urls = [];
      for (var i = 1; i <= TOTAL; i++) urls.push(scanUrl(base, i));
      urls.push('A');
      var lens = [14, 15, 26, 27, 42, 43, 62, 84, 106, 122, 152, 180, 213];
      for (var j = 0; j < lens.length; j++) {
        var s = 'NEX-';
        while (s.length < lens[j]) s += 'Q';
        urls.push(s.slice(0, lens[j]));
      }
      return urls;
    },
    run: function () {
      var R = [];
      function t(name, fn) {
        try { fn(); R.push({ name: name, ok: true }); }
        catch (e) { R.push({ name: name, ok: false, err: String(e && e.message || e) }); }
      }
      function assert(cond, msg) { if (!cond) throw new Error(msg || 'assertion failed'); }
      var seed = CFG.seed;
      function opts(rng) { return { seed: seed, now: 1000, rng: rng, total: TOTAL }; }

      t('Trails: ' + TOTAL + ' steps, start where you scanned first, always end at the core', function () {
        for (var start = 1; start < TOTAL; start++) {
          var rng = Game.mulberry32(start * 977);
          for (var n = 0; n < 300; n++) {
            var p = Game.generatePath(start, rng, TOTAL);
            assert(p.length === TOTAL, 'length');
            assert(p[0] === start, 'start');
            assert(p[TOTAL - 1] === CORE, 'must end at the core');
            var sorted = p.slice().sort(function (a, b) { return a - b; }).join(',');
            assert(sorted === '1,2,3,4,5,6,7', 'permutation: ' + sorted);
          }
        }
      });

      t('Trails are randomized — players get different routes', function () {
        /* 5 free middle slots -> 120 possible orders; 600 draws should hit nearly all */
        var rng = Game.mulberry32(42);
        var seen = {};
        var distinct = 0;
        for (var n = 0; n < 600; n++) {
          var k = Game.generatePath(1, rng, TOTAL).join('.');
          if (!seen[k]) { seen[k] = 1; distinct++; }
        }
        assert(distinct >= 110, 'only ' + distinct + '/120 possible trails seen in 600 draws');
      });

      t('Randomization spreads nodes across positions', function () {
        var rng = Game.mulberry32(7);
        var counts = {};
        for (var n = 0; n < 2000; n++) {
          var p = Game.generatePath(5, rng, TOTAL);
          for (var pos = 1; pos <= TOTAL - 2; pos++) {
            var key = p[pos] + '@' + pos;
            counts[key] = (counts[key] || 0) + 1;
          }
        }
        for (var id = 1; id < TOTAL; id++) {
          if (id === 5) continue;
          for (var pos2 = 1; pos2 <= TOTAL - 2; pos2++) {
            var c = counts[id + '@' + pos2] || 0;
            assert(c > 300 && c < 520, 'node ' + id + ' at position ' + pos2 + ' occurred ' + c + '/2000 times');
          }
        }
      });

      t('Happy path: ' + TOTAL + ' in-order scans run started → … → final-clue → completed', function () {
        var res = Game.processScan(null, 4, Game.keyFor(4, seed), opts(Game.mulberry32(99)));
        assert(res.status === 'started', 'first scan: ' + res.status);
        var s = res.session;
        var path = s.path; /* follow the trail the engine generated */
        for (var i = 1; i < TOTAL; i++) {
          res = Game.processScan(s, path[i], Game.keyFor(path[i], seed), opts());
          s = res.session;
          var want = i < TOTAL - 2 ? 'advanced' : i === TOTAL - 2 ? 'final-clue' : 'completed';
          assert(res.status === want, 'step ' + (i + 1) + ': got ' + res.status + ', wanted ' + want);
        }
        assert(s.completedAt != null, 'completedAt set');
        assert(s.scans.length === TOTAL, TOTAL + ' scans logged');
      });

      t('Rule: out-of-order scans are rejected and change nothing', function () {
        var s = Game.processScan(null, 2, Game.keyFor(2, seed), opts(Game.mulberry32(123))).session;
        for (var i = 1; i < 3; i++) s = Game.processScan(s, s.path[i], Game.keyFor(s.path[i], seed), opts()).session;
        assert(s.scans.length === 3, 'setup: expected 3 scans');
        for (var id = 1; id <= TOTAL; id++) {
          if (id === s.path[3]) continue;
          var res = Game.processScan(s, id, Game.keyFor(id, seed), opts());
          assert(['wrong', 'visited', 'master-early', 'repeat'].indexOf(res.status) >= 0, 'id ' + id + ' gave ' + res.status);
          assert(res.session.scans.length === 3, 'scan count changed on rejection of id ' + id);
        }
        var ok = Game.processScan(s, s.path[3], Game.keyFor(s.path[3], seed), opts());
        assert(ok.status === 'advanced' && ok.session.scans.length === 4, 'expected next was not accepted');
      });

      t('Rule: the core QR is blocked until all field nodes are done', function () {
        var first = Game.processScan(null, CORE, Game.keyFor(CORE, seed), opts());
        assert(first.status === 'master-first' && !first.session, 'cannot start at the core');
        var s = Game.processScan(null, 3, Game.keyFor(3, seed), opts(Game.mulberry32(5))).session;
        for (var i = 1; i < TOTAL - 1; i++) {
          var res = Game.processScan(s, CORE, Game.keyFor(CORE, seed), opts());
          assert(res.status === 'master-early', 'after ' + i + ' scans: ' + res.status);
          s = Game.processScan(s, s.path[i], Game.keyFor(s.path[i], seed), opts()).session;
        }
        assert(s.scans.length === TOTAL - 1, 'setup: expected ' + (TOTAL - 1) + ' scans');
        var fin = Game.processScan(s, CORE, Game.keyFor(CORE, seed), opts());
        assert(fin.status === 'completed', 'after ' + (TOTAL - 1) + ' scans the core must accept, got ' + fin.status);
      });

      t('Re-scanning the current node is harmless (page refresh safe)', function () {
        var rng = Game.mulberry32(8);
        var path = Game.generatePath(6, rng, TOTAL);
        var s = Game.processScan(null, path[0], Game.keyFor(path[0], seed), opts(rng)).session;
        var res = Game.processScan(s, path[0], Game.keyFor(path[0], seed), opts());
        assert(res.status === 'repeat' && res.session.scans.length === 1, 'repeat mishandled: ' + res.status);
      });

      t('Previously visited nodes are flagged, not re-counted', function () {
        var s = Game.processScan(null, 1, Game.keyFor(1, seed), opts(Game.mulberry32(9))).session;
        for (var i = 1; i < 4; i++) s = Game.processScan(s, s.path[i], Game.keyFor(s.path[i], seed), opts()).session;
        assert(s.scans.length === 4, 'setup: expected 4 scans');
        var res = Game.processScan(s, s.path[1], Game.keyFor(s.path[1], seed), opts());
        assert(res.status === 'visited' && res.session.scans.length === 4, 'visited mishandled: ' + res.status);
      });

      t('Forged or mistyped keys are rejected', function () {
        var res = Game.processScan(null, 3, 'ZZZZ', opts());
        assert(res.status === 'bad-key', 'got ' + res.status);
      });

      t('Codes outside 1–' + TOTAL + ' are rejected', function () {
        assert(Game.processScan(null, 0, 'A', opts()).status === 'unknown', 'id 0');
        assert(Game.processScan(null, TOTAL + 1, 'A', opts()).status === 'unknown', 'id ' + (TOTAL + 1));
        assert(Game.processScan(null, NaN, 'A', opts()).status === 'unknown', 'NaN');
      });

      t('After completion, further scans never alter the record', function () {
        var s = Game.processScan(null, 6, Game.keyFor(6, seed), opts(Game.mulberry32(77))).session;
        for (var i = 1; i < TOTAL; i++) s = Game.processScan(s, s.path[i], Game.keyFor(s.path[i], seed), opts()).session;
        assert(s.completedAt != null, 'setup: mission should be complete');
        var before = JSON.stringify(s);
        for (var id = 1; id <= TOTAL; id++) {
          var res = Game.processScan(s, id, Game.keyFor(id, seed), opts());
          assert(res.status === 'already-completed', 'id ' + id + ': ' + res.status);
        }
        assert(JSON.stringify(s) === before, 'session mutated after completion');
      });

      t('Manual keys are stable and unique per node', function () {
        var seen = {};
        for (var id = 1; id <= TOTAL; id++) {
          var k = Game.keyFor(id, seed);
          assert(/^[0-9A-Z]{4}$/.test(k), 'key format ' + k);
          assert(k === Game.keyFor(id, seed), 'key not stable');
          assert(!seen[k], 'duplicate key ' + k);
          seen[k] = 1;
        }
      });

      t('Config: ' + TOTAL + ' checkpoints (field nodes + core) with locations and clues', function () {
        assert(TOTAL === 7, 'expected 7 checkpoints, got ' + TOTAL);
        for (var id = 1; id <= TOTAL; id++) {
          var c = cp(id);
          assert(c, 'checkpoint ' + id + ' missing');
          assert(String(c.location || '').length > 0, 'location ' + id + ' empty');
          assert(String(c.clue || '').length > 0, 'clue ' + id + ' empty');
        }
        assert(CFG.coreGuardian && typeof CFG.coreGuardian.photo === 'string', 'coreGuardian.photo slot missing');
        assert(typeof CFG.crewCode === 'string', 'crewCode slot missing');
        assert(typeof CFG.eventUrl === 'string', 'eventUrl slot missing');
      });

      t('Challenges: every step 1–' + TOTAL + ' has a solvable, verifiable puzzle', function () {
        assert(CFG.challenges.length === TOTAL, 'expected ' + TOTAL + ' challenges');
        for (var step = 1; step <= TOTAL; step++) {
          var ch = challengeFor(step);
          assert(ch && ch.step === step, 'challenge for step ' + step + ' missing');
          assert(String(ch.question || '').length > 0, 'question ' + step + ' empty');
          assert(Array.isArray(ch.fail) && ch.fail.length > 0, 'fail lines ' + step + ' missing');
          if (ch.type === 'choice') {
            assert(Array.isArray(ch.options) && ch.options.length >= 2, 'options ' + step);
            assert(typeof ch.answer === 'number' && ch.options[ch.answer] != null, 'answer index ' + step);
            assert(checkAnswer(ch, ch.answer), 'correct choice rejected at step ' + step);
            assert(!checkAnswer(ch, (ch.answer + 1) % ch.options.length), 'wrong choice accepted at step ' + step);
          } else if (ch.type === 'text') {
            assert(Array.isArray(ch.answers) && ch.answers.length >= 1, 'answers ' + step);
            assert(checkAnswer(ch, ch.answers[0]), 'correct text rejected at step ' + step);
            assert(!checkAnswer(ch, 'DEFINITELY-WRONG-42'), 'wrong text accepted at step ' + step);
            assert(!checkAnswer(ch, ''), 'empty text accepted at step ' + step);
          } else {
            throw new Error('unknown challenge type at step ' + step);
          }
        }
      });

      t('Answers are forgiving about case, spacing and punctuation', function () {
        assert(checkAnswer(challengeFor(3), '  shutdown '), 'lowercase Caesar answer rejected');
        assert(checkAnswer(challengeFor(3), 'shut down'), 'spaced Caesar answer rejected');
        assert(checkAnswer(challengeFor(6), 'core'), 'lowercase failsafe rejected');
        assert(checkAnswer(challengeFor(6), ' Core '), 'padded failsafe rejected');
        assert(checkAnswer(challengeFor(6), 'c o r e'), 'letter-by-letter failsafe rejected');
        assert(checkAnswer(challengeFor(7), 'e'), 'lowercase kill character rejected');
        assert(!checkAnswer(challengeFor(3), 'SHUTDOWNX'), 'near-miss accepted');
        assert(!checkAnswer(challengeFor(6), 'CORES'), 'wrong word accepted');
      });

      t('Puzzle answers are actually correct (cipher, binary, letter codes)', function () {
        /* the Caesar dial must be able to reach the accepted answer */
        var ch3 = challengeFor(3);
        var hit = -1;
        for (var sft = 0; sft < 26; sft++) if (caesar(ch3.cipher, sft) === ch3.answers[0]) hit = sft;
        assert(hit === 23, 'VKXWGRZQ should decode to SHUTDOWN at shift +23 (i.e. -3), got ' + hit);
        /* binary widget arithmetic */
        var ch5 = challengeFor(5), bits = String(ch5.bits).split(''), n = bits.length, sum = 0;
        for (var i = 0; i < n; i++) if (bits[i] === '1') sum += Math.pow(2, n - 1 - i);
        assert(String(sum) === ch5.options[ch5.answer], 'binary ' + ch5.bits + ' = ' + sum + ' but the marked answer is ' + ch5.options[ch5.answer]);
        /* A=1 letter codes — read the numbers out of the question itself so this
           check keeps working if the failsafe word is ever changed again */
        var ch6 = challengeFor(6);
        var nums = ch6.question.match(/\d+/g).map(Number);
        var word = nums.map(function (v) { return String.fromCharCode(64 + v); }).join('');
        assert(checkAnswer(ch6, word), ch6.question + ' should decode to an accepted answer, got ' + word);
      });

      t('Challenge gate: a scan opens that step’s challenge; solving unlocks the next clue', function () {
        var s = Game.processScan(null, 2, Game.keyFor(2, seed), opts(Game.mulberry32(31))).session;
        assert(pendingStep(s) === 1, 'fresh session should owe challenge 1, got ' + pendingStep(s));
        s.solved = 1;
        assert(pendingStep(s) === null, 'solved session should owe nothing');
        s = Game.processScan(s, s.path[1], Game.keyFor(s.path[1], seed), opts()).session;
        assert(pendingStep(s) === 2, 'second scan should owe challenge 2, got ' + pendingStep(s));
        /* full run: after every scan exactly one challenge is owed, never more */
        for (var i = 2; i < TOTAL; i++) {
          s.solved = s.scans.length;
          s = Game.processScan(s, s.path[i], Game.keyFor(s.path[i], seed), opts()).session;
          assert(pendingStep(s) === s.scans.length, 'step ' + s.scans.length + ' gate wrong');
        }
        assert(s.completedAt != null && pendingStep(s) === TOTAL, 'final scan must owe the core challenge');
      });

      t('QR sheet refuses addresses a phone cannot open', function () {
        assert(baseProblem(''), 'empty address must be refused');
        assert(baseProblem('not a url'), 'non-URL must be refused');
        assert(baseProblem('http://localhost:8080/'), 'localhost must be refused');
        assert(baseProblem('http://127.0.0.1:8080/'), '127.0.0.1 must be refused');
        assert(baseProblem('https://n-abc123.googleusercontent.com/userCodeAppPanel'), 'Apps Script sandbox must be refused');
        assert(baseProblem('https://abc.claudeusercontent.com/_f/123/'), 'artifact sandbox must be refused');
        assert(!baseProblem('https://script.google.com/macros/s/AKfycb123/exec'), 'a real /exec URL must be accepted');
        assert(!baseProblem('http://192.168.1.5:8080/'), 'a LAN address must be allowed (with a caution)');
        assert(baseCaution('http://192.168.1.5:8080/'), 'a LAN address must carry a caution');
        assert(!baseCaution('https://script.google.com/macros/s/AKfycb123/exec'), 'a real URL needs no caution');
      });

      t('QR engine: all ' + TOTAL + ' node codes encode and read back exactly', function () {
        var base = 'http://192.168.1.5:8080/';
        for (var id = 1; id <= TOTAL; id++) {
          var url = scanUrl(base, id);
          var qr = QRGen.encodeText(url, { ecl: 'M' });
          assert(QRGen.selfCheck(qr) === url, 'read-back mismatch for №' + id);
        }
      });

      t('QR engine: a real Apps Script /exec URL still fits and reads back', function () {
        var base = 'https://script.google.com/macros/s/AKfycbwqQ1p3RmY7XvZk9LbN4dHs2TgUj8VaEcPfMnKrWyBt/exec';
        for (var id = 1; id <= TOTAL; id++) {
          var url = scanUrl(base, id);
          var qr = QRGen.encodeText(url, { ecl: 'M' });
          assert(QRGen.selfCheck(qr) === url, 'read-back mismatch for №' + id + ' (len ' + url.length + ')');
        }
      });

      t('QR engine: boundary lengths (versions 1–10) and Unicode read back', function () {
        var payloads = SelfTest.samplePayloads().concat(['Namaste ₹ 🎉 Param Foundation']);
        for (var i = 0; i < payloads.length; i++) {
          var qr = QRGen.encodeText(payloads[i], { ecl: 'M' });
          assert(QRGen.selfCheck(qr) === payloads[i], 'mismatch at payload length ' + payloads[i].length);
        }
        var threw = false;
        var tooLong = new Array(215).join('X') + 'XX';
        try { QRGen.encodeText(tooLong, { ecl: 'M' }); } catch (e) { threw = true; }
        assert(threw, 'oversize payload must throw (len ' + tooLong.length + ')');
      });

      t('QR engine: every mask pattern and ECC level reads back', function () {
        for (var m = 0; m < 8; m++) {
          var qr = QRGen.encodeText('MASK TEST ' + m, { ecl: 'M', mask: m });
          assert(qr.mask === m, 'mask not applied');
          assert(QRGen.selfCheck(qr) === 'MASK TEST ' + m, 'mask ' + m + ' read-back');
        }
        var levels = ['L', 'M', 'Q', 'H'];
        for (var e = 0; e < levels.length; e++) {
          var qr2 = QRGen.encodeText('ECC ' + levels[e] + ' check', { ecl: levels[e] });
          assert(QRGen.selfCheck(qr2) === 'ECC ' + levels[e] + ' check', 'ecl ' + levels[e]);
        }
      });

      return R;
    }
  };
  g.QRHuntSelfTest = SelfTest;

  /* ---------- boot & routing ---------- */
  function cleanUrl() {
    try { g.history.replaceState(null, '', g.location.pathname + g.location.hash); } catch (e) { /* sandboxed */ }
  }

  function onAction(ev) {
    var el = ev.target.closest('[data-action]');
    if (!el) return;
    var act = el.getAttribute('data-action');
    if (act === 'manual') {
      ev.preventDefault(); stopAutoPlay();
      document.getElementById('shell').className = 'wrap';
      /* strip #organiser without firing hashchange (which would clobber the form) */
      try { g.history.replaceState(null, '', g.location.pathname + g.location.search); } catch (e) {}
      renderManual();
    }
    else if (act === 'organiser') { ev.preventDefault(); stopAutoPlay(); try { g.location.hash = 'organiser'; } catch (e) {} renderOrganiser('sheet'); }
    else if (act === 'home') { ev.preventDefault(); stopAutoPlay(); document.getElementById('shell').className = 'wrap'; try { g.location.hash = ''; } catch (e) {} renderHome(); }
    else if (act === 'tab') { stopAutoPlay(); renderOrganiser(el.getAttribute('data-tab')); }
    else if (act === 'ans') { sfx('tap'); submitAnswer(parseInt(el.getAttribute('data-i'), 10)); }
    else if (act === 'dial') { dialTurn(parseInt(el.getAttribute('data-d'), 10)); }
    else if (act === 'bit') { bitFlip(parseInt(el.getAttribute('data-i'), 10)); }
    else if (act === 'core-yes') { coreArmed = true; sfx('tap'); var s1 = store.load(); if (s1) renderChallenge(s1, {}); else renderHome(); }
    else if (act === 'core-no') { var s0 = store.load(); if (s0 && pendingStep(s0)) renderCoreConfirm(s0, true); else renderHome(); }
    else if (act === 'simscan') {
      var id = parseInt(el.getAttribute('data-id'), 10);
      describeResult(id, simScan(id));
      renderOrganiser('sim');
    }
    else if (act === 'autoplay') { autoPlay(); }
    else if (act === 'reset-player') {
      stopAutoPlay();
      if (g.confirm && !g.confirm('Reset this browser’s mission? The current trail will be lost.')) return;
      store.clear(); attempts = {}; coreArmed = false;
      if (g.location.hash === '#organiser') renderOrganiser('sim'); else renderHome();
    }
    else if (act === 'runtests') {
      render(testView(null).replace('Run all checks', 'Running…'));
      setTimeout(function () {
        var results = SelfTest.run();
        document.getElementById('shell').className = 'wrap wide';
        render('<div class="tabs no-print">' +
          '<button class="tab" data-action="tab" data-tab="sheet">Print QR sheet</button>' +
          '<button class="tab" data-action="tab" data-tab="sim">Simulator</button>' +
          '<button class="tab active" data-action="tab" data-tab="test">Self-test</button>' +
          '<button class="tab" data-action="tab" data-tab="guide">Event guide</button></div>' +
          testView(results) +
          '<p class="no-print"><a data-action="home" tabindex="0" role="button">&larr; Back to player view</a></p>');
      }, 30);
    }
    else if (act === 'sheet-refresh') {
      var b0 = document.getElementById('baseurl');
      if (b0) sheetBase = b0.value.trim();
      renderOrganiser('sheet');
    }
    else if (act === 'print') {
      /* commit the live address field, re-render the cards, then print */
      var bi = document.getElementById('baseurl');
      if (bi) sheetBase = bi.value.trim();
      if (baseProblem(sheetBase != null ? sheetBase : defaultBase())) { renderOrganiser('sheet'); return; }
      renderOrganiser('sheet');
      g.print();
    }
  }

  function boot() {
    app = document.getElementById('app');
    var footorg = document.getElementById('footorg');
    if (footorg) footorg.textContent = CFG.eventName + ' · ' + CFG.eventLine;
    applyPrefs();

    document.body.addEventListener('click', onAction);
    /* keyboard parity for the div/anchor triggers */
    document.body.addEventListener('keydown', function (ev) {
      if (ev.key !== 'Enter' && ev.key !== ' ') return;
      var el = ev.target.closest && ev.target.closest('[data-action]');
      if (!el || el.tagName === 'BUTTON' || el.tagName === 'INPUT') return;
      ev.preventDefault(); onAction(ev);
    });
    var mt = document.getElementById('tgMotion'), st = document.getElementById('tgSound');
    if (mt) mt.addEventListener('click', function () { prefs.motion = prefs.motion ? 0 : 1; savePrefs(); applyPrefs(); });
    if (st) st.addEventListener('click', function () { prefs.sound = prefs.sound ? 0 : 1; savePrefs(); applyPrefs(); if (prefs.sound) sfx('tap'); });

    g.addEventListener('hashchange', function () {
      if (g.location.hash === '#organiser') renderOrganiser('sheet');
      else { stopAutoPlay(); document.getElementById('shell').className = 'wrap'; renderHome(); }
    });

    /* QR deep-link params: from the URL, or (inside the Apps Script sandbox,
       where the iframe has no query string) from the injected APP_PARAMS. */
    var qrRaw = null, keyRaw = '', wantOrganiser = false;
    try {
      var params = new URLSearchParams(g.location.search);
      qrRaw = params.get('qr');
      keyRaw = (params.get('k') || '').trim();
      wantOrganiser = params.get('organiser') != null;
    } catch (e) { /* ignore */ }
    if (qrRaw == null && g.APP_PARAMS && g.APP_PARAMS.qr != null) {
      qrRaw = String(g.APP_PARAMS.qr);
      keyRaw = String(g.APP_PARAMS.k || '').trim();
    }
    if (g.APP_PARAMS && g.APP_PARAMS.organiser != null) wantOrganiser = true;

    if (qrRaw != null && qrRaw.trim() !== '') {
      var id = /^\d{1,2}$/.test(qrRaw.trim()) ? parseInt(qrRaw.trim(), 10) : NaN;
      cleanUrl();
      handleScan(id, keyRaw);
    } else if (wantOrganiser || g.location.hash === '#organiser') {
      renderOrganiser('sheet');
    } else {
      renderHome();
    }
  }

  if (hasDoc) {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
    else boot();
  }
})(typeof window !== 'undefined' ? window : globalThis);
